[package]
name = "v13-codec-experiment"
version = "0.1.0"
edition = "2024"
publish = false
[features]
default = ["protobuf", "msgpack"]
protobuf = ["dep:prost"]
msgpack = ["dep:rmpv"]
[dependencies]
prost = { package = "view-wire-prost", path = "../vendor/view-wire-prost", version = "=0.14.4", features = ["no-recursion-limit"], optional = true }
rmpv = { version = "=1.3.1", optional = true }
num-bigint = "=0.4.8"
serde_json = "=1.0.151"
