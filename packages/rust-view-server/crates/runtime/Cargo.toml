[package]
name = "product-source-ingestion"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = []
fault-injection = []
kafka = ["dep:rdkafka"]
kafka-canonical = ["kafka"]
kafka-tls = ["kafka", "rdkafka/ssl"]

[dependencies]
product-request-admission = { path = "../admission" }
v13-codec-experiment = { path = "../wire", default-features = false, features = ["msgpack"] }
rust-differential-product-core = { path = "../core" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
rusqlite = { version = "=0.40.2", features = ["bundled", "backup"] }
prost = "=0.14.4"
prost-types = "=0.14.4"
reqwest = { version = "=0.13.5", default-features = false, features = ["blocking", "rustls"] }
rdkafka = { version = "=0.39.0", default-features = false, features = ["cmake-build"], optional = true }
tungstenite = { version = "=0.30.0", default-features = false, features = ["handshake"] }
opentelemetry = { version = "=0.33.0", default-features = false, features = ["metrics", "trace"] }
opentelemetry_sdk = { version = "=0.33.0", default-features = false, features = ["metrics", "trace", "testing"] }
opentelemetry-prometheus = "=0.33.0"
opentelemetry-otlp = { version = "=0.33.0", default-features = false, features = ["metrics", "trace", "http-proto", "reqwest-blocking-client", "reqwest-rustls"] }
prometheus = { version = "=0.14.0", default-features = false }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["registry", "std"] }
tracing-opentelemetry = { version = "=0.34.0", default-features = false }
hyper = { version = "=1.11.1", features = ["server", "http1"] }
hyper-util = { version = "=0.1.21", features = ["tokio"] }
http-body-util = "=0.1.5"
bytes = "=1.12.1"
tokio = { version = "=1.53.1", features = ["rt", "net", "sync", "time", "signal", "macros"] }

