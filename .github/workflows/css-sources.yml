name: CSS workspace sources

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  css-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          version-file: package.json
          node-version-file: .node-version
          run-install: false
      - run: vp install --frozen-lockfile --ignore-scripts
      - run: vp exec tsc -p tools/tailwind-sources/tsconfig.json
      - run: vp run test:css-sources
      - name: Check generated CSS sources without modifying files
        run: vp run check:css-sources
