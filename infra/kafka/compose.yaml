# Only this development dependency is containerized. Invoke through scripts/kafka.py.
services:
  kafka:
    image: apache/kafka:4.1.2@sha256:5cc2a2fd93fa2687b44015eee04fb2c3edd9e526bd64bf8bec5ff1e268772e0e
    ports:
      - "127.0.0.1:${RVS_KAFKA_PORT:?run port required}:19092"
    labels:
      io.rvs.owner: "${RVS_KAFKA_OWNER:?owner required}"
      io.rvs.run: "${RVS_KAFKA_RUN:?run required}"
    environment:
      CLUSTER_ID: "${RVS_KAFKA_CLUSTER_ID:?cluster required}"
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:9092,HOST://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,HOST://127.0.0.1:${RVS_KAFKA_PORT}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /var/lib/kafka/data/kraft
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: "2"
      KAFKA_DEFAULT_REPLICATION_FACTOR: "1"
      KAFKA_MIN_INSYNC_REPLICAS: "1"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_OFFSETS_TOPIC_NUM_PARTITIONS: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_TRANSACTION_STATE_LOG_NUM_PARTITIONS: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_LOG_RETENTION_HOURS: "168"
      KAFKA_HEAP_OPTS: -Xms256m -Xmx1g
    mem_limit: 2g
    volumes:
      - data:/var/lib/kafka/data
    healthcheck:
      test: [CMD, /opt/kafka/bin/kafka-broker-api-versions.sh, --bootstrap-server, kafka:9092]
      interval: 5s
      timeout: 10s
      retries: 24
      start_period: 10s
    stop_grace_period: 45s
volumes:
  data:
    labels:
      io.rvs.owner: "${RVS_KAFKA_OWNER}"
      io.rvs.run: "${RVS_KAFKA_RUN}"
networks:
  default:
    labels:
      io.rvs.owner: "${RVS_KAFKA_OWNER}"
      io.rvs.run: "${RVS_KAFKA_RUN}"
